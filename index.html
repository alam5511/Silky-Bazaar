<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silky Bazaar - Pure Silk Sarees & Designer Suits</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            padding-bottom: 30px;
            user-select: none;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 22px 15px 18px 15px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 800;
        }

        .brand-tagline {
            font-size: 11px;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 4px;
        }

        .gold-divider {
            height: 1px;
            width: 80px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 8px auto;
        }

        .contact-info {
            font-size: 11px;
            color: #d1d1d1;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .contact-info i {
            color: #d4af37;
            margin-right: 4px;
        }

        .phone-link {
            color: #fcf6ba;
            text-decoration: none;
        }

        /* Single Column Layout */
        .reel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            max-width: 420px;
            margin: 25px auto;
            padding: 0 12px;
        }

        .reel-card {
            background: linear-gradient(145deg, #141414, #0d0d0d);
            border-radius: 18px;
            overflow: hidden;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        /* 9:16 Image Box */
        .image-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            position: relative;
            background-color: #1a1a1a;
            cursor: pointer;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* Telegram Video Container Box */
        .video-box {
            width: 100%;
            min-height: 400px;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            overflow: hidden;
        }

        /* Subtle Watermark Overlay */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
            letter-spacing: 2px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        .card-details {
            padding: 18px 15px;
            text-align: center;
            background: #121212;
        }

        .product-title {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #fcf6ba;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .whatsapp-btn {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .call-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid #d4af37;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        /* Comment Section Box Styling */
        .comment-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(212, 175, 55, 0.2);
        }

        .comment-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            outline: none;
        }

        .comment-input::placeholder {
            color: #888;
        }

        .comment-btn {
            background: rgba(212, 175, 55, 0.15);
            color: #fcf6ba;
            border: 1px solid #d4af37;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Fullscreen Image Modal */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-wrapper {
            position: relative;
            max-width: 95%;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-wrapper img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            pointer-events: none;
        }

        .modal-wrapper .watermark {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.18);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2001;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            margin-top: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            background: #0d0d0d;
        }

        .footer-brand {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: #d4af37;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .footer-text {
            font-size: 11px;
            color: #777;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Header Section -->
    <header>
        <div class="brand-name">Silky Bazaar</div>
        <div class="brand-tagline">Pure Silk Sarees & Designer Suits</div>
        <div class="gold-divider"></div>
        <div class="contact-info">
            <p><i class="fa-solid fa-location-dot"></i> Mubarakpur, Azamgarh, Uttar Pradesh, India - 276404</p>
            <p><i class="fa-solid fa-phone"></i> Mobile: <a href="tel:+916392380133" class="phone-link">+91 6392380133</a></p>
        </div>
    </header>

    <!-- Product Catalog -->
    <div class="reel-container" id="catalog"></div>

    <!-- Fullscreen Modal View -->
    <div class="fullscreen-modal" id="imageModal">
        <span class="close-btn" onclick="closeFullscreen()">&times;</span>
        <div class="modal-wrapper">
            <img id="modalImg" src="" alt="Full View">
            <div class="watermark">SILKY BAZAAR</div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <div class="footer-brand">SILKY BAZAAR</div>
        <div class="footer-text">© Mubarakpur Silk Sarees & Suit Collection. All Rights Reserved.</div>
    </footer>

    <script>
        const phoneNumber = "916392380133";

        // Yahan aap naye telegram videos aur images add kar sakte hain
        const products = [
            {
                id: 1,
                name: "Banarasi Pure Silk Saree 01",
                type: "image",
                image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=800"
            },
            {
                id: 2,
                name: "Pure Tissue Banarasi Saree (Telegram Video)",
                type: "video",
                telegramPost: "silkybazaar/5" // Channel post path (e.g. username/post_id)
            },
            {
                id: 3,
                name: "Designer Bridal Suit Collection 02",
                type: "image",
                image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800"
            },
            {
                id: 4,
                name: "Katan Silk Handloom Saree 03",
                type: "image",
                image: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=800"
            }
        ];

        const catalogContainer = document.getElementById("catalog");

        products.forEach(product => {
            const mediaReference = product.type === "image" ? product.image : `Telegram Video (${product.telegramPost})`;
            const defaultMessage = `Hi Silky Bazaar, mujhe ye product order karna hai:\n\n*Product Name:* ${product.name}\n*Details:* ${mediaReference}`;
            const defaultWhatsappLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(defaultMessage)}`;

            const card = document.createElement("div");
            card.className = "reel-card";

            let mediaHTML = "";
            if (product.type === "video") {
                mediaHTML = `<div class="video-box" id="telegram-container-${product.id}"></div>`;
            } else {
                mediaHTML = `
                    <div class="image-box" onclick="openFullscreen('${product.image}')">
                        <img src="${product.image}" alt="${product.name}">
                        <div class="watermark">SILKY BAZAAR</div>
                    </div>
                `;
            }

            card.innerHTML = `
                ${mediaHTML}
                <div class="card-details">
                    <div class="product-title">${product.name}</div>
                    <div class="action-buttons">
                        <a href="tel:+${phoneNumber}" class="call-btn">
                            <i class="fa-solid fa-phone"></i> Call
                        </a>
                        <a href="${defaultWhatsappLink}" target="_blank" class="whatsapp-btn">
                            <i class="fa-brands fa-whatsapp"></i> Direct Order
                        </a>
                    </div>
                    <div class="comment-section">
                        <input type="text" id="comment-${product.id}" class="comment-input" placeholder="कमेंट या सवाल लिखें (उदा: रेट, कलर...)" />
                        <button onclick="sendCustomComment(${product.id}, '${product.name}', '${mediaReference}')" class="comment-btn">
                            <i class="fa-paper-plane"></i> Send
                        </button>
                    </div>
                </div>
            `;

            catalogContainer.appendChild(card);

            // Dynamically load Telegram widget script for videos
            if (product.type === "video") {
                const videoContainer = document.getElementById(`telegram-container-${product.id}`);
                const tgScript = document.createElement("script");
                tgScript.async = true;
                tgScript.src = "https://telegram.org/js/telegram-widget.js?24";
                tgScript.setAttribute("data-telegram-post", product.telegramPost);
                tgScript.setAttribute("data-width", "100%");
                videoContainer.appendChild(tgScript);
            }
        });

        // Function to send custom written comment to WhatsApp
        function sendCustomComment(id, name, mediaInfo) {
            const commentBox = document.getElementById(`comment-${id}`);
            const userComment = commentBox.value.trim();

            let message = `Hi Silky Bazaar,\n\n*Product Name:* ${name}\n*Media Info:* ${mediaInfo}`;
            
            if (userComment !== "") {
                message += `\n\n*मेरा सवाल/कमेंट:* ${userComment}`;
            }

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Open Fullscreen Image Logic
        function openFullscreen(imgSrc) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        // Close Fullscreen Image Logic
        function closeFullscreen() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>

</body>
</html>
